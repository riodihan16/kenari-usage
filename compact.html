<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Widget melayang Kenari Usage: pemakaian kuota mingguan dan bulanan."
    />
    <title>Kenari Usage</title>
    <link rel="stylesheet" href="./src/compact.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body class="compact-body">
    <div class="bubble" id="bubble">
      <button
        class="ring-view"
        id="ring-view"
        type="button"
        aria-label="Kenari Usage, buka detail kuota"
        title="Hover untuk detail, tahan dan geser untuk memindah"
      >
        <span class="ring-wrap">
          <svg class="ring" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <circle class="ring-track" cx="32" cy="32" r="27" pathLength="100" />
            <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="27" pathLength="100" />
          </svg>
          <span class="ring-label" id="ring-label">
            <strong id="ring-pct">…</strong>
            <small>minggu</small>
          </span>
        </span>
      </button>

      <section class="card-view" id="card-view" aria-label="Detail kuota">
        <header class="cc-head" id="cc-head">
          <span class="cc-title">Kenari <span id="cc-plan" class="muted"></span></span>
          <span class="cc-actions">
            <button id="cc-open" class="cc-btn acc" type="button">Buka</button>
            <button id="cc-quit" class="cc-btn cc-quit" type="button" aria-label="Keluar">
              Keluar
            </button>
          </span>
        </header>
        <div id="cc-windows" class="cc-windows">
          <div class="muted small">Memuat…</div>
        </div>
        <footer class="cc-foot"><span id="cc-updated" class="muted small"></span></footer>
      </section>
    </div>
    <script type="module" src="/src/compact.ts"></script>
  </body>
</html>
