[package]
name = "kenari-usage"
version = "0.1.0"
description = "Kenari usage dashboard"
edition = "2021"
license = "MIT"
authors = ["Ridho DR <ridho.d.ramadhan@gmail.com>"]
repository = "https://github.com/riodihan16/kenari-usage"

[lib]
name = "kenari_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
